name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # Only what runs in production; build tooling is checked separately below.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Build (Next.js for Cloudflare Workers)
        run: npx opennextjs-cloudflare build

      - name: Bundle Worker (dry run, no deploy)
        run: npx wrangler deploy --dry-run --outdir .wrangler-dry-run
